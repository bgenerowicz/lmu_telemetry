name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to publish the exe as a release

# A newer push makes an older build pointless; don't let two race on the release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,webapp,server]" pyinstaller

      - name: Test
        run: pytest -q

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --name lmu-analyser --paths src
          --collect-data plotly --collect-data dash --add-data references:references
          --exclude-module pyarrow --exclude-module pandas --exclude-module pkg_resources
          packaging/lmu-analyser.py

      - name: Smoke test exe
        run: python packaging/smoke_test.py dist/lmu-analyser.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lmu-analyser-windows
          path: dist/lmu-analyser.exe

      # Pushes to the default branch replace the "latest" release, so
      # releases/latest/download/lmu-analyser.exe always has the newest build.
      - name: Publish as the latest release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/lmu-analyser.exe \
            --title "LMU Lap Analyser (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Download lmu-analyser.exe below." \
            --target "$GITHUB_SHA" --latest

      - name: Attach to versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lmu-analyser.exe
