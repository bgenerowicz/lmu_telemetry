name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to attach the exe to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,webapp]" pyinstaller

      - name: Test
        run: pytest -q

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --name lmu-analyser --paths src
          --collect-data plotly --collect-data dash --add-data references:references
          --exclude-module pyarrow --exclude-module pandas --exclude-module pkg_resources
          packaging/lmu-analyser.py

      - name: Smoke test exe
        run: python packaging/smoke_test.py dist/lmu-analyser.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lmu-analyser-windows
          path: dist/lmu-analyser.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lmu-analyser.exe
