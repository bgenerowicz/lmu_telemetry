name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to attach the exe to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,webapp]" pyinstaller

      - name: Test
        run: pytest -q

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --name lmu-analyser --paths src
          --collect-data plotly --exclude-module pyarrow --exclude-module pandas
          packaging/lmu-analyser.py

      - name: Smoke test exe on the sample recordings
        shell: pwsh
        run: |
          $files = Get-ChildItem samples -Filter *.duckdb | ForEach-Object { $_.FullName }
          .\dist\lmu-analyser.exe $files[0] --no-open -o report.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item report.html).Length -lt 1MB) { throw "report too small" }

      - uses: actions/upload-artifact@v4
        with:
          name: lmu-analyser-windows
          path: |
            dist/lmu-analyser.exe
            report.html

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lmu-analyser.exe
