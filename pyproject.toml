[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmu-telemetry"
version = "0.0.1"
description = "Compare Le Mans Ultimate laps against reference laps, corner by corner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
uploader = ["watchdog>=4.0", "httpx>=0.27"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
webapp = ["dash>=2.16,<5", "plotly>=5.20"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
