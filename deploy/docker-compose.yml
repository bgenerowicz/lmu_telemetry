# Leaderboard server on the VPS, behind its existing Caddy container. That Caddy
# runs in host network mode, so it reaches this container on 127.0.0.1:${LMU_PORT}.
# From deploy/:  docker compose up -d --build
services:
  lmu-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lmu-server
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # Loopback only: Caddy is the way in.
    ports:
      - "127.0.0.1:${LMU_PORT:-8000}:8000"
