# Loose conditions, v4: as loose-v3, but each car model (lmu_core.carmodel) keeps
# its top 5 drivers, whatever team or livery they drove.
#
# Any session, setup and fuel; dry track; valid timed laps only.
# Rule names are LapFacts fields (src/lmu_core/lapfacts.py). See docs/RULESETS.md.
# Never edit a ruleset once laps have been accepted under it: copy it to a new
# file with a new id so old and new times aren't mixed.

id: loose-v4
name: Loose conditions v4
description: >
  Any session type, setup and fuel load. Dry track (no rain, no standing
  water). Only timed laps that stayed within track limits. One leaderboard
  per class and track, with the top 5 drivers of each car model.

top_n: 5
top_n_per: [car_model]

# Recordings don't contain the game version, so it can't be part of the key yet.
leaderboard_key: [track, layout, car_class]

on_unknown: warn

rules:
  rain_pct:
    max: 0

  track_wetness_pct:
    max: 5

  is_valid:
    equals: true
    on_unknown: reject

  is_flying:
    equals: true
    on_unknown: reject
