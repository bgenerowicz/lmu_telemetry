# Standard conditions, v1.
#
# A lap only enters the shared leaderboard if it passes every rule below.
# Rule names are LapFacts fields (src/lmu_core/lapfacts.py). See docs/RULESETS.md.
#
# Never edit a ruleset once laps have been accepted under it: copy it to a new
# file with a new id (standard-v2.yaml) so old and new times aren't mixed.

id: standard-v1
name: Standard conditions v1
description: >
  Dry, clear practice session, default setup, short fuel, valid flying laps.

top_n: 10

# Laps compete only against laps with the same values for these fields.
# game_version is included because BoP/physics updates make old times incomparable.
leaderboard_key: [track, layout, car, game_version]

# What to do when the recording doesn't contain a field a rule needs.
# "warn" accepts the lap but flags it; "reject" refuses it. Rules can override.
on_unknown: warn

rules:
  session_type:
    one_of: [Practice]

  weather:
    one_of: [Clear]

  track_temp_c:
    min: 20
    max: 35

  setup_is_default:
    equals: true

  fuel_at_start_l:
    max: 30

  is_valid:
    equals: true
    on_unknown: reject

  is_flying:
    equals: true
    on_unknown: reject
