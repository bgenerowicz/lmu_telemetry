# Loose conditions, v5: as loose-v4, but laps are kept per band of conditions
# (lmu_core.bands: fixed or open setup, track temperature, fuel), each car model
# keeping its top 5 drivers in each, so leaderboards can be filtered by them.
#
# Any session, setup and fuel; dry track; valid timed laps only.
# Rule names are LapFacts fields (src/lmu_core/lapfacts.py). See docs/RULESETS.md.
# Never edit a ruleset once laps have been accepted under it: copy it to a new
# file with a new id so old and new times aren't mixed.

id: loose-v5
name: Loose conditions v5
description: >
  Any session type, setup and fuel load. Dry track (no rain, no standing
  water). Only timed laps that stayed within track limits. One leaderboard
  per class and track, with the top 5 drivers of each car model, per setup type, track temperature
  and fuel band.

top_n: 5
top_n_per: [car_model, setup_fixed, track_temp_band, fuel_band]

# Recordings don't contain the game version, so it can't be part of the key yet.
leaderboard_key: [track, layout, car_class]

on_unknown: warn

rules:
  rain_pct:
    max: 0

  track_wetness_pct:
    max: 5

  is_valid:
    equals: true
    on_unknown: reject

  is_flying:
    equals: true
    on_unknown: reject
